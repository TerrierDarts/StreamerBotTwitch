[config]
schemaVersion = "0.0.1"

[package]
namespace = "CodeWithTD"
name = "ValheimStreamerbot"
versionNumber = "0.8.0"
description = "Twitch interacts with Valheim through Streamer.bot: alerts, mob and item spawning, raids, weather, kill-all, heal, immortal mode, /request items and viewer portraits."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "client-side" ]
